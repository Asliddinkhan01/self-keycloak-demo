# ---------------------------------------------------------------------------
# Custom Keycloak login theme: "demo"
#
# A theme is just a folder under /opt/keycloak/themes with this layout:
#
#   themes/<name>/<type>/theme.properties
#   themes/<name>/<type>/resources/...
#
# <type> is one of: login, account, admin, email, welcome.
# Only "login" is customised here, so the account and admin consoles keep
# their stock look.
#
# parent=keycloak means: inherit every FreeMarker template (login.ftl,
# register.ftl, error.ftl ...) and every resource from the built-in "keycloak"
# theme, and only override what is listed below. That is the whole trick: no
# template is copied, so nothing breaks when you upgrade Keycloak.
# ---------------------------------------------------------------------------
parent=keycloak
import=common/keycloak

# "styles" is REPLACED by the child, not merged, so the parent's css/login.css
# has to be repeated here or the page loses all of its base styling.
# Files are resolved through the parent chain, so css/login.css is served from
# the built-in theme and css/demo.css from this folder.
styles=css/login.css css/demo.css
