# ---------------------------------------------------------------------------
# OneID Platform — local environment.
#
#   cp .env.example .env
#   docker compose up -d
#
# Phase 1-2 brings up the infrastructure only: PostgreSQL and Keycloak.
# The Spring services, mock-oneid and the Vue frontend are added in later
# phases, each with its own service block here.
#
# PORTS: every published port is deliberately off its default. 5432 and 8080
# are the two most contested ports on a developer machine, and a clash there
# produces failures that are very hard to read — a service silently fetches
# the wrong server's response instead of Keycloak's JWKS and then rejects every
# token with a bare 401. Inside the Docker network the containers still use
# their normal ports; only the host side differs.
# ---------------------------------------------------------------------------

# Pinned so the stack does not depend on the folder name. Without this, Compose
# derives the project name from the directory, and renaming or moving the
# project orphans the running containers and the data volume under the old name.
name: oneid-platform

services:

  postgres:
    image: postgres:18
    container_name: oneid-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-appdb}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    ports:
      - "${POSTGRES_PORT:-5452}:5432"
    volumes:
      # Scripts here run ONCE, when the data directory is first created.
      # Editing them later has no effect until `docker compose down -v`.
      - ./postgres/init:/docker-entrypoint-initdb.d:ro
      # Mounted on the PARENT directory, not on .../data: PostgreSQL 18 images
      # keep data in a major-version subdirectory and refuse to start if they
      # find old-style data in .../data. The parent works for 17 and 18 alike.
      - oneid_postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-appdb}"]
      interval: 5s
      timeout: 3s
      retries: 20

  keycloak:
    image: quay.io/keycloak/keycloak:26.1
    container_name: oneid-keycloak
    # start-dev: HTTP allowed, no hostname strictness, theme caching off.
    # The DATABASE is production-shaped; the server mode is not. Production
    # needs `kc.sh build` and `start --optimized` behind TLS.
    command: ["start-dev", "--import-realm"]
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN_USER:-admin}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:-admin}

      # Without these five lines Keycloak falls back to an embedded H2 file.
      # "postgres" is the service name above; inside the Docker network it
      # resolves to the container on its INTERNAL port 5432, not 5452.
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-appdb}
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: keycloak
      KC_DB_SCHEMA: keycloak

      # Pins the public URL, and therefore the "iss" claim of every token.
      KC_HOSTNAME: ${KEYCLOAK_HOSTNAME_URL:-http://localhost:8190}
      KC_HTTP_ENABLED: "true"

      # Read by realm-export.json when the realm is imported, so no secret is
      # ever written into a committed file.
      USER_SERVICE_CLIENT_SECRET: ${USER_SERVICE_CLIENT_SECRET:-user-service-secret}
      CADASTRAL_SERVICE_CLIENT_SECRET: ${CADASTRAL_SERVICE_CLIENT_SECRET:-cadastral-service-secret}
    ports:
      - "${KEYCLOAK_PORT:-8190}:8080"
    volumes:
      - ./keycloak/import:/opt/keycloak/data/import:ro

volumes:
  oneid_postgres_data:
