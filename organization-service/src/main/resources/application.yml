server:
  port: ${ORGANIZATION_SERVICE_PORT:8092}

spring:
  application:
    name: organization-service

  # ---------------------------------------------------------------------------
  # This service owns the "organization_service" schema and logs in as its own
  # PostgreSQL role, which has no privileges on any other schema. A stray join
  # across a service boundary fails in the database, not in code review.
  # Port 5452, not 5432: see the README on contested default ports.
  # ---------------------------------------------------------------------------
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5452}/${DB_NAME:appdb}
    username: ${DB_USER:organization_service}
    password: ${DB_PASSWORD:organization_service}

  jpa:
    hibernate:
      # Flyway owns the schema, so Hibernate must never change it. "validate"
      # checks that entities and migrated tables agree and fails loudly at
      # startup if they drift. "update" would let Hibernate invent DDL at
      # runtime, which is a well-known way to lose data.
      ddl-auto: validate
    properties:
      hibernate:
        default_schema: organization_service
    # Off in a REST service: it holds a Hibernate session open for the whole
    # request and hides lazy-loading mistakes until production.
    open-in-view: false
    show-sql: false

  flyway:
    enabled: true
    schemas: organization_service
    default-schema: organization_service

  security:
    oauth2:
      resourceserver:
        jwt:
          # The single most important line of security configuration.
          #
          # Spring reads {issuer}/.well-known/openid-configuration, takes
          # jwks_uri from it, and downloads Keycloak's PUBLIC signing keys.
          # Every token is then verified locally against those keys, and its
          # "iss" claim must equal this value exactly.
          #
          # The call is LAZY — made on the first request, not at startup. A
          # service whose Keycloak is unreachable therefore starts cleanly and
          # then answers 401 to everything with a bare "WWW-Authenticate:
          # Bearer" and no error description. That empty challenge is the
          # fingerprint of a decoder that could not initialise, and it is worth
          # recognising on sight.
          issuer-uri: ${KEYCLOAK_ISSUER_URI:http://localhost:8190/realms/platform}

          # AUDIENCE VALIDATION. Not on by default in Spring, and it is the
          # check that stops a stolen or misdirected service token being
          # replayed somewhere it was never meant for.
          #
          #   platform-api   every human token carries this
          #   organization-service   service tokens addressed to THIS service
          #
          # A token minted for organization-service therefore fails here, even
          # though its signature, issuer and expiry are all perfectly valid.
          audiences:
            - platform-api
            - organization-service

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never

logging:
  level:
    # Verbose while learning: it shows exactly why a request was rejected —
    # bad signature, wrong issuer, expired token, or a missing authority.
    org.springframework.security: DEBUG
