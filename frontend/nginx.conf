# Serves the built Vue app. Nothing here proxies the API: the browser calls the
# gateway directly, which is why the gateway, not nginx, owns CORS.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    # Headers that cost nothing and close off whole classes of mistakes.
    # (nginx drops server-level add_header lines in any location that sets its
    # own, so the /assets/ block repeats them.)
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;

    # index.html names the current hashed bundle, so it must never be cached:
    # a stale copy would keep loading an old build after a deployment.
    location = /index.html {
        add_header Cache-Control "no-cache" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "no-referrer" always;
    }

    # Hashed file names change whenever their content does, so they can be kept forever.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "no-referrer" always;
    }

    # One page. Any other path returns it, so reloading any URL still loads the app.
    location / {
        try_files $uri /index.html;
    }
}
